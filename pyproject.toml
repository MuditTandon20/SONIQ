[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soniq"
version = "0.2.0"
description = "Local speech recognition and evaluation for Windows"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.2,<2",
  "sounddevice>=0.5,<0.6",
  "jiwer>=4,<5",
  "numpy>=1.23,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
package = ["pyinstaller>=6,<7"]

[project.scripts]
soniq = "soniq.cli:main"

[tool.setuptools.packages.find]
include = ["soniq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
