[package]
name = "soniq"
version = "0.2.0"
description = "Private, local Windows dictation"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "=0.15.3"
hound = "3.5"
tempfile = "3"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_Memory"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
